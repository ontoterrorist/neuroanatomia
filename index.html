<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuroatlas · Neuroanatomía funcional en 3D</title>
<meta name="description" content="Atlas interactivo en 3D del sistema nervioso humano: de la anatomía macroscópica a la molécula. Curso por semestres, vías, simuladores de resonancia magnética y fMRI, y evaluación.">
<meta name="theme-color" content="#0b0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e13'/%3E%3Cpath d='M9 20c-3-2-3-7 1-9 1-4 7-5 9-2 4-1 7 3 5 7 1 3-2 6-5 5-1 3-5 3-6 1-2 1-4 0-4-2z' fill='none' stroke='%23e6b566' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 9v14M12 13c2 0 3 1 4 2M20 17c-2 0-3-1-4-2' fill='none' stroke='%23e6b566' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<div id="app" data-modo="atlas">
  <header id="barra">
    <button id="btn-menu" class="ico solo-movil" aria-label="Abrir panel de navegación" title="Navegación">☰</button>
    <a class="marca" href="./" aria-label="Neuroatlas, inicio">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M9 20c-3-2-3-7 1-9 1-4 7-5 9-2 4-1 7 3 5 7 1 3-2 6-5 5-1 3-5 3-6 1-2 1-4 0-4-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 9v14M12 13c2 0 3 1 4 2M20 17c-2 0-3-1-4-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Neuroatlas</span>
    </a>
    <nav id="modos" aria-label="Secciones">
      <button data-modo="atlas" class="activo">Atlas 3D</button>
      <button data-modo="vias">Vías</button>
      <button data-modo="micro">Microescala</button>
      <button data-modo="imagen">Imagen</button>
      <button data-modo="curso">Curso</button>
      <button data-modo="quiz">Evaluación</button>
    </nav>
    <div class="hueco"></div>
    <button id="btn-buscar" class="pildora" title="Buscar una estructura (tecla /)"><span aria-hidden="true">⌕</span> <span class="txt">Buscar</span> <kbd>/</kbd></button>
    <button id="btn-acerca" class="ico" aria-label="Créditos y fuentes" title="Créditos y fuentes">ⓘ</button>
    <button id="btn-info" class="ico solo-movil" aria-label="Abrir ficha" title="Ficha">▤</button>
  </header>

  <aside id="izq" aria-label="Navegación"></aside>

  <main id="lienzo">
    <canvas id="gl" aria-label="Modelo tridimensional interactivo"></canvas>
    <div id="etiquetas" aria-hidden="true"></div>
    <div id="pista" role="tooltip" hidden></div>
    <div id="escala" title="Escala aproximada"><i></i><span></span></div>
    <div id="hud-sup"></div>
    <div id="herramientas" role="toolbar" aria-label="Herramientas del visor"></div>
    <div id="carga"><div class="caja"><div class="t">Cargando el atlas…</div><div class="b"><i></i></div><div class="d"></div></div></div>
  </main>

  <aside id="der" aria-label="Ficha"></aside>

  <section id="pagina" hidden></section>
</div>

<dialog id="dlg-buscar" aria-label="Buscar">
  <input id="q" type="search" placeholder="Buscar estructura, vía, unidad, simulador o molécula…" autocomplete="off" spellcheck="false">
  <ul id="resultados"></ul>
</dialog>
<dialog id="dlg-acerca" aria-label="Créditos y fuentes"></dialog>

<script type="module" src="js/main.js"></script>
<noscript><p style="padding:2rem;color:#eee">Neuroatlas necesita JavaScript y WebGL para mostrar los modelos 3D.</p></noscript>
</body>
</html>
